name: Build HONOR X6c Verified Release APK
on:
  push:
    branches: ["bridge-live-honor"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore bridgelive-release.jks \
            -storepass BridgeLive2026 \
            -keypass BridgeLive2026 \
            -alias bridgelive \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bridge Live, OU=Personal, O=Bridge Live, L=London, ST=London, C=GB"
      - name: Zipalign and sign v1 v2 v3
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/BridgeLive-HonorX6c-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks bridgelive-release.jks \
            --ks-key-alias bridgelive \
            --ks-pass pass:BridgeLive2026 \
            --key-pass pass:BridgeLive2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/BridgeLive-HonorX6c-release-v3.apk \
            dist/BridgeLive-HonorX6c-aligned.apk
      - name: Verify final APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/BridgeLive-HonorX6c-release-v3.apk
          "$BUILD_TOOLS/aapt" dump badging dist/BridgeLive-HonorX6c-release-v3.apk
          unzip -t dist/BridgeLive-HonorX6c-release-v3.apk
          sha256sum dist/BridgeLive-HonorX6c-release-v3.apk
      - name: Record run id
        run: echo "${{ github.run_id }}" > dist/latest-run-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeLive-HonorX6c-Verified-Release-v3
          path: dist/BridgeLive-HonorX6c-release-v3.apk
          retention-days: 14
      - name: Commit verified APK and run id to branch
        continue-on-error: true
        run: |
          git config user.name "Bridge Live Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/BridgeLive-HonorX6c-release-v3.apk dist/latest-run-id.txt
          git commit -m "Build verified HONOR X6c release APK v3 [skip ci]" || exit 0
          git pull --rebase origin bridge-live-honor || true
          git push || true
