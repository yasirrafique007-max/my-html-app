name: Build Bridge Live HONOR APK
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/build-bridge-live-honor.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: bridge-live-honor
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Save APK to Android branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BridgeLive-HonorX6c-debug.apk
          git config user.name "Bridge Live Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/BridgeLive-HonorX6c-debug.apk
          git commit -m "Build HONOR X6c debug APK [skip ci]" || exit 0
          git push origin HEAD:bridge-live-honor
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeLive-HonorX6c-APK
          path: dist/BridgeLive-HonorX6c-debug.apk
          retention-days: 14
