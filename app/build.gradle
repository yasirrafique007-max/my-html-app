plugins { id 'com.android.application' }

android {
    namespace 'com.bridgelive.callassist'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bridgelive.callassist'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '0.7.0-honor'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// HONOR X6c compatibility build v7: force legacy v1 signing support
